name: Build RecapAI Windows

on:
  push:
    branches:
      - build/recapai-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout RecapAI source
        uses: actions/checkout@v4
        with:
          repository: souldret/recapai
          ref: main
          path: recapai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recapai/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install PyQt6==6.7.0 PyQt6-Qt6==6.7.0 PyQt6-sip==13.6.0 qtawesome==1.3.1 Pillow==10.4.0 opencv-python==4.10.0.84 pydub==0.25.1 pygame==2.5.2 soundfile==0.12.1 requests==2.32.3 python-dotenv==1.0.1 httpx==0.27.0 "edge-tts>=7.0.0" langdetect==1.0.9 moviepy==1.0.3 imageio==2.34.0 imageio-ffmpeg==0.5.1 "numpy>=1.24.0,<2.0.0" tqdm==4.66.5

      - name: Build with PyInstaller
        working-directory: recapai
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean tools/recapai.spec

      - name: Smoke-check executable
        working-directory: recapai
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/RecapAI/RecapAI.exe")) {
            throw "RecapAI.exe was not produced."
          }
          Get-Item "dist/RecapAI/RecapAI.exe" | Format-List FullName,Length

      - name: Zip portable app
        working-directory: recapai
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/RecapAI/*" -DestinationPath "RecapAI-Windows-portable.zip" -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RecapAI-Windows-portable
          path: recapai/RecapAI-Windows-portable.zip
          if-no-files-found: error
          retention-days: 7
